services:
  - type: web
    name: dali-grid-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python releases/v07-modeling-first-905/serve_cloud.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: DALI_API_ALLOWED_HOSTS
        value: ''
